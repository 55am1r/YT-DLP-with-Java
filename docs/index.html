<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZ-Tube</title>
    <!-- No-JS fallback: this line's URL is kept in sync by update-redirect.sh -->
    <meta http-equiv="refresh" content="0; url=https://though-templates-schema-spelling.trycloudflare.com" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: #eef1f7;
        background:
          radial-gradient(1000px 500px at 80% -10%, rgba(225,29,42,.16), transparent 60%),
          #0e0f13;
      }
      .card { text-align: center; padding: 24px; }
      .logo {
        width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px;
        display: grid; place-items: center; font-size: 30px; color: #fff;
        background: linear-gradient(145deg, #ff4757, #e11d2a);
        box-shadow: 0 8px 22px rgba(225,29,42,.45);
      }
      h1 { margin: 0 0 6px; font-size: 24px; }
      p { margin: 0 0 18px; color: #98a0b3; font-size: 14px; }
      .spinner {
        width: 26px; height: 26px; margin: 0 auto 18px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.15); border-top-color: #ff4757;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      a.btn {
        display: inline-block; text-decoration: none; color: #fff; font-weight: 600;
        padding: 12px 20px; border-radius: 12px;
        background: linear-gradient(145deg, #ff4757, #e11d2a);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">▼</div>
      <h1>EZ-Tube</h1>
      <div class="spinner"></div>
      <p>Opening the downloader…</p>
      <a id="go" class="btn" href="https://though-templates-schema-spelling.trycloudflare.com">
        Tap here if it doesn't open
      </a>
    </div>
    <script>
      // Kept in sync by update-redirect.sh after a reboot.
      const TARGET = "https://though-templates-schema-spelling.trycloudflare.com";
      document.getElementById("go").href = TARGET;
      location.replace(TARGET);
    </script>
  </body>
</html>
